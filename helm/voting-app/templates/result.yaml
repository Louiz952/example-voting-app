apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  labels:
    app: result
spec:
  replicas: {{ .Values.result.replicas }}
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
        - name: result
          image: "{{ .Values.image.registry }}/{{ .Values.result.image }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PGHOST
              value: "db"
            - name: PGUSER
              value: {{ .Values.db.username | quote }}
            - name: PGDATABASE
              value: {{ .Values.db.database | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName | quote }}
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 80
              name: result
---
apiVersion: v1
kind: Service
metadata:
  name: result
  labels:
    app: result
spec:
  type: {{ .Values.result.service.type }}
  selector:
    app: result
  ports:
    - name: result-service
      port: {{ .Values.result.service.port }}
      targetPort: 80